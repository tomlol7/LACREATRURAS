<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Underground Radio</title>

  <script src="https://unpkg.com/three"></script>
  <script src="https://unpkg.com/globe.gl"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js"></script>

  <style>
    :root {
      --bg: #000000;
      --panel: rgba(7,11,16,.78);
      --line: rgba(255,255,255,.095);
      --text: #f4f7fb;
      --muted: #8793a3;
      --green: #20f28a;
      --shadow: 0 22px 80px rgba(0,0,0,.45);
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: var(--bg); }
    body {
      overflow: hidden;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }

    #globeViz { position: fixed; inset: 0; z-index: 1; }

    #ui { opacity: 0; pointer-events: none; transition: opacity 1.5s ease; z-index: 20; position: relative; }
    body.ready #ui { opacity: 1; pointer-events: auto; }

    .glass {
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      backdrop-filter: blur(20px) saturate(130%);
      -webkit-backdrop-filter: blur(20px) saturate(130%);
    }

    #bootScreen {
      position: fixed; inset: 0; z-index: 100;
      display: flex; align-items: center; justify-content: center;
      background: transparent;
      transition: opacity 1.5s ease, visibility 1.5s;
    }
    #bootScreen.done { opacity: 0; visibility: hidden; pointer-events: none; }

    .bootCard {
      width: min(440px, calc(100vw - 36px));
      text-align: center;
      padding: 28px;
      border: 1px solid rgba(255,255,255,.05);
      border-radius: 28px;
      background: rgba(6,10,15,.6);
      box-shadow: 0 30px 120px rgba(0,0,0,.8);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    
    .bootLogo {
      position: relative;
      width: 84px; height: 84px; margin: 0 auto 20px;
      display: grid; place-items: center;
    }
    .bootLogo::before, .bootLogo::after {
      content: ""; position: absolute; border-radius: 50%; inset: 0;
      border: 1px solid rgba(32,242,138,.18);
    }
    .bootLogo::before { animation: orbit 2.6s linear infinite; }
    .bootLogo::after { inset: 11px; border-color: rgba(32,242,138,.34); animation: orbitReverse 1.9s linear infinite; }
    
    .bootCore {
      width: 28px; height: 28px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #caffdf 0%, var(--green) 35%, #0bb866 100%);
      box-shadow: 0 0 30px rgba(32,242,138,.65), 0 0 80px rgba(32,242,138,.17);
    }
    
    .bootTitle { font-size: 15px; font-weight: 900; letter-spacing: .15em; text-transform: uppercase; }
    
    .bootProgress { height: 3px; border-radius: 999px; background: rgba(255,255,255,.075); overflow: hidden; margin-top: 24px; position: relative; }
    .bootFill { 
      position: absolute; height: 100%; width: 40%; 
      background: linear-gradient(90deg, transparent, var(--green), transparent); 
      box-shadow: 0 0 18px rgba(32,242,138,.55); 
      animation: sweep 1.5s infinite linear;
    }
    .bootMeta { display: flex; justify-content: center; margin-top: 12px; font-size: 9px; color: #7f8a99; letter-spacing: .05em; text-transform: uppercase;}

    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes orbitReverse { to { transform: rotate(-360deg); } }
    @keyframes sweep { 0% { left: -40%; } 100% { left: 100%; } }

    #topbar { position: fixed; top: 16px; left: 16px; right: 16px; display: flex; gap: 10px; pointer-events: none; }
    #brand, #searchWrap { pointer-events: auto; }
    #brand { display: flex; align-items: center; gap: 11px; padding: 10px 14px; border-radius: 16px; min-height: 50px; }
    .brandOrb { width: 11px; height: 11px; border-radius: 50%; background: var(--green); box-shadow: 0 0 20px rgba(32,242,138,.92); }
    #brand strong { display: block; font-size: 12px; letter-spacing: .09em; text-transform: uppercase; }
    #brand small { display: block; color: var(--muted); font-size: 10px; margin-top: 2px; }

    #searchWrap { position: relative; flex: 1; max-width: 400px; }
    #search { width: 100%; height: 100%; border-radius: 16px; border: 1px solid var(--line); outline: none; padding: 0 16px 0 43px; color: var(--text); background: var(--panel); font-size: 13px; }
    #searchIcon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #8792a2; font-size: 17px; }
    
    #side { position: fixed; right: 16px; top: 82px; width: 340px; max-height: calc(100vh - 190px); border-radius: 18px; display: flex; flex-direction: column; overflow: hidden; }
    #filters { padding: 10px; display: grid; grid-template-columns: 1fr; gap: 8px; border-bottom: 1px solid var(--line); }
    .field { padding: 10px; border-radius: 11px; border: 1px solid var(--line); background: rgba(255,255,255,.035); color: var(--text); }
    .field option { background: #0d1117; }
    
    #stationList { overflow: auto; padding: 7px; scrollbar-width: thin; flex: 1; }
    .stationItem { width: 100%; display: grid; grid-template-columns: 42px 1fr; align-items: center; gap: 9px; padding: 8px; border: 1px solid transparent; border-radius: 12px; background: transparent; color: var(--text); text-align: left; margin-bottom: 4px; transition: 0.2s; }
    .stationItem:hover { background: rgba(255,255,255,.04); border-color: var(--line); }
    .logo { width: 42px; height: 42px; border-radius: 10px; object-fit: cover; background: #10151d; }
    .name { display: block; font-size: 12px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sub { display: block; font-size: 9px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    #player { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); width: min(800px, calc(100vw - 32px)); border-radius: 18px; padding: 10px 12px; display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; }
    #nowArt { width: 52px; height: 52px; border-radius: 12px; object-fit: cover; }
    #stationName { font-size: 14px; font-weight: 850; }
    #stationMeta { color: var(--muted); font-size: 9px; margin-top: 4px; }
    #controls button { width: 39px; height: 39px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.04); color: var(--text); }
    #playBtn { background: var(--green)!important; color: #05110a!important; font-weight: 950; }

    @media(max-width: 760px) {
      #brand { display: none; }
      #side { left: 9px; right: 9px; width: auto; max-height: 40vh; }
      #player { left: 9px; right: 9px; bottom: 9px; width: auto; transform: none; }
    }
  </style>
</head>
<body>

  <div id="globeViz"></div>

  <div id="bootScreen">
    <div class="bootCard">
      <div class="bootLogo"><div class="bootCore"></div></div>
      <div class="bootTitle">Global Underground Radio</div>
      <div class="bootProgress"><div class="bootFill"></div></div>
      <div class="bootMeta"><span id="bootStatus">Igniting engines...</span></div>
    </div>
  </div>

  <div id="ui">
    <div id="topbar">
      <div id="brand" class="glass"><span class="brandOrb"></span><div><strong>Global Underground</strong><small>Live planetary frequencies</small></div></div>
      <div id="searchWrap"><span id="searchIcon">⌕</span><input id="search" autocomplete="off" placeholder="Search world frequencies..."></div>
    </div>

    <aside id="side" class="glass">
      <div id="filters">
        <select id="countryFilter" class="field"><option value="">All Regions</option></select>
      </div>
      <div id="stationList"></div>
    </aside>

    <div id="player" class="glass">
      <img id="nowArt" src="https://dummyimage.com/96x96/0b1118/20f28a.png&text=GUR" alt="">
      <div style="min-width:0;">
        <div id="stationName" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Awaiting Signal</div>
        <div id="stationMeta">Select a green pin to tune in</div>
      </div>
      <div id="controls">
        <button id="playBtn">▶</button>
      </div>
    </div>
  </div>

  <audio id="audio" preload="none" playsinline></audio>

  <script>
    const FETCH_LIMIT = 5000; 
    const CACHE_KEY = 'gur_stations_v1';
    const FALLBACK_SERVERS = ['https://de1.api.radio-browser.info', 'https://at1.api.radio-browser.info'];
    
    const state = { all: [], filtered: [], globe: null, hls: null };
    const $ = id => document.getElementById(id);
    const audio = $('audio');

    function updateStatus(text) { if ($('bootStatus'))$('bootStatus').textContent = text; }

    // Renders the Globe instantly before API fetches
    function initGlobe() {
      state.globe = Globe()($('#globeViz'))
        .backgroundColor('#000000')
        .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
        .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
        .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
        .showAtmosphere(true)
        .atmosphereColor('#86c9ff')
        .atmosphereAltitude(0.15)
        // Set altitude to 4: perfect deep space height inside the clipping plane
        .pointOfView({ lat: 10, lng: -20, altitude: 4 }, 0);

      state.globe.controls().autoRotate = true;
      state.globe.controls().autoRotateSpeed = 0.5;

      setTimeout(() => {
        const directional = state.globe.lights().find(l => l.type === 'DirectionalLight');
        if (directional) {
          directional.position.set(1, 0.5, 1); 
          directional.intensity = 2.5; 
        }
      }, 100);
    }

    // Pull down the boot screen and dive to Earth
    function hideBootScreen() {
      $('bootScreen').classList.add('done');
      document.body.classList.add('ready');
      state.globe.pointOfView({ lat: 25, lng: 10, altitude: 1.8 }, 3500);
      state.globe.controls().autoRotateSpeed = 0.2;
    }

    async function fetchStations(isBackground = false) {
      if (!isBackground) updateStatus("Scanning orbital frequencies...");
      
      const base = FALLBACK_SERVERS[0];
      const params = new URLSearchParams({
        has_geo_info: 'true', hidebroken: 'true', order: 'votes', reverse: 'true', limit: String(FETCH_LIMIT)
      });
      
      try {
        // AbortController ensures we don't hang indefinitely 
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 8000); // 8 second strict timeout

        const res = await fetch(`${base}/json/stations/search?${params}`, { 
          headers: { Accept: 'application/json' },
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        if (!res.ok) throw new Error('API Error');
        const data = await res.json();
        
        // Strip heavy data to easily fit inside localStorage (max 5mb)
        const strippedData = data.filter(r => r.geo_lat && r.geo_long).map(r => ({
          id: r.stationuuid,
          name: r.name,
          country: r.country,
          lat: Number(r.geo_lat),
          lng: Number(r.geo_long),
          tags: r.tags || '',
          favicon: r.favicon || '',
          url: r.url_resolved || r.url
        }));

        state.all = strippedData;
        state.filtered = state.all;
        
        try { localStorage.setItem(CACHE_KEY, JSON.stringify(strippedData)); } catch(e) { console.warn("Cache full"); }

        populateFilters(); renderList(); renderPins();
        
        if (!isBackground) {
          updateStatus("Signal Locked.");
          setTimeout(hideBootScreen, 500);
        }
      } catch (e) {
        console.error("Fetch failed", e);
        if (!isBackground) {
          updateStatus("Offline/Timeout - Entering anyway...");
          setTimeout(hideBootScreen, 1500);
        }
      }
    }

    function renderPins() {
      if (!state.globe) return;
      state.globe.particlesData(state.filtered.length ? [{ items: state.filtered }] : [])
        .particleList('items')
        .particleLat('lat')
        .particleLng('lng')
        .particleAltitude(0.01)
        .particlesSize(0.35)
        .particleColor(() => '#20f28a')
        .onParticleClick(s => tune(s));
    }

    function renderList() {
      $('stationList').innerHTML = state.filtered.slice(0, 150).map(s => `
        <button class="stationItem" onclick="window.tuneById('${s.id}')">
          <img class="logo" src="${s.favicon || 'https://dummyimage.com/96x96/0b1118/20f28a.png&text=GUR'}" onerror="this.src='https://dummyimage.com/96x96/0b1118/20f28a.png&text=GUR'">
          <div style="min-width:0"><span class="name">${s.name}</span><span class="sub">${s.country} ${s.tags ? '· '+s.tags.split(',')[0] : ''}</span></div>
        </button>
      `).join('');
    }

    function populateFilters() {
      const countries = [...new Set(state.all.map(s => s.country).filter(Boolean))].sort();
      $('countryFilter').innerHTML = '<option value="">All Regions</option>' + 
        countries.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    window.tuneById = (id) => tune(state.all.find(s => s.id === id));

    async function tune(s) {
      if (!s) return;
      $('stationName').textContent = s.name;
      $('stationMeta').textContent = s.country;
      $('nowArt').src = s.favicon \vert{}\vert{} 'https://dummyimage.com/96x96/0b1118/20f28a.png&text=GUR';$('playBtn').textContent = '…';
      
      state.globe.controls().autoRotate = false;
      state.globe.pointOfView({ lat: s.lat, lng: s.lng, altitude: 0.8 }, 1500);

      if (state.hls) { state.hls.destroy(); }
      const url = s.url;

      try {
        if (url.includes('.m3u8') && window.Hls && Hls.isSupported()) {
          state.hls = new Hls();
          state.hls.loadSource(url);
          state.hls.attachMedia(audio);
          state.hls.on(Hls.Events.MANIFEST_PARSED, () => audio.play().then(() => $('playBtn').textContent = 'Ⅱ'));
        } else {
          audio.src = url;
          await audio.play();
          $('playBtn').textContent = 'Ⅱ';
        }
      } catch {
        $('playBtn').textContent = '▶';
      }
    }

    $('playBtn').addEventListener('click', () => {
      if (audio.paused && audio.src) { audio.play(); $('playBtn').textContent = 'Ⅱ'; }
      else { audio.pause(); $('playBtn').textContent = '▶'; }
    });

    $('search').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      const c = $('countryFilter').value;
      state.filtered = state.all.filter(s => 
        (s.name + s.tags).toLowerCase().includes(q) && (!c || s.country === c)
      );
      renderList(); renderPins();
    });

    $('countryFilter').addEventListener('change', () => {$('search').dispatchEvent(new Event('input'));
    });

    // Main Boot Sequence executed instantly
    function boot() {
      initGlobe();

      const cachedData = localStorage.getItem(CACHE_KEY);
      
      if (cachedData) {
        // FAST BOOT: User has been here before. Load from local memory immediately.
        try {
          updateStatus("Restoring local coordinates...");
          state.all = JSON.parse(cachedData);
          state.filtered = state.all;
          populateFilters(); renderList(); renderPins();
          
          setTimeout(hideBootScreen, 400); // Fly right in
          
          fetchStations(true); // Quietly refresh data in the background for next time
        } catch(e) {
          fetchStations(false); // Cache corrupted, fetch fresh
        }
      } else {
        // FIRST TIME BOOT: Wait for the API, but timeout after 8 seconds
        fetchStations(false);
      }
    }

    boot();
  </script>
</body>
</html>
